[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-library-toolkit"
version = "0.1.0"
description = "A safe, local toolkit for cataloging and organizing personal media libraries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
authors = [
  { name = "Media Library Toolkit contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
media = "media_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_toolkit = ["catalog/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
