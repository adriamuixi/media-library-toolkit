[application]
default_profile = "production"
log_level = "INFO"

[paths]
workspace = "/Users/example/MediaToolkit/data"
logs = "/Users/example/MediaToolkit/logs"
reports = "/Users/example/MediaToolkit/reports"
cache = "/Users/example/MediaToolkit/cache"

[profiles.production]
database = "/Users/example/MediaToolkit/data/production/catalog.sqlite3"
environment = "PRODUCTION"

[profiles.test]
database = "/Users/example/MediaToolkit/data/test/catalog.sqlite3"
environment = "TEST"

[safety]
default_media_mode = "read-only"
require_write_confirmation = true

[metadata]
panorama_aspect_ratio_threshold = 2.0
batch_size = 100
timeout_seconds = 60
exiftool_command = "exiftool"
ffprobe_command = "ffprobe"

[scan]
include_hidden = false
batch_size = 500
